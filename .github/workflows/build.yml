name: Validate and build FPK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source and capture release evidence
        shell: bash
        run: |
          mkdir -p .cache/release
          ./scripts/check.sh | tee .cache/release/check.log
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p .tools && go test -c -o .tools/browser-tests ./cmd/fnterminal
        env:
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
      - run: npm run test:browser
      - run: ./scripts/download-fnpack.sh
      - run: ./scripts/build-fpk.sh x86
      - run: sudo FNTERMINAL_PRODUCTION_BIN="${{ github.workspace }}/.build/x86/app/bin/fnterminal" .tools/browser-tests -test.run=TestLinuxProductionGateway -test.timeout=30s
      - run: ./scripts/build-fpk.sh arm
      - run: python3 scripts/release-report.py not_run
      - run: python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: FnTerminal-fpk-and-checks
          path: |
            dist/
            test-results/
